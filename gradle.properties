# --- Plugin identity ------------------------------------------------------------------
# Single source of truth: the Gradle project, the built artifact and the generated
# run/mods/<group>.<name>/manifest.json all use these values.
# Changing 'name' also renames the Gradle project and the built artifact.
# Override per run with -Pgroup=... -Pname=... -Pversion=...
group=com.poupapitas
name=burning-torches
version=0.1

# Folder that directly contains the Hytale patchline folders ("release", "pre-release").
# When unset the build falls back to <hytale_home>/install and then to %APPDATA%/Hytale/install.
# NOTE: backslashes are escape characters in .properties files ("\U", "\b", "\a", ...),
# so use forward slashes here.
hytale.installDir=

# Patchline to compile and run against: "release" or "pre-release".
hytale.patchline=release

# --- debugServer task -----------------------------------------------------------------
# JDWP port the server listens on for a debugger to attach to.
hytale.debug.port=5005

# Whether the server waits for a debugger to attach before running any code (true/false).
hytale.debug.suspend=false

# Assets passed to the server as --assets. Defaults to the Assets.zip beside the Server/
# folder of the install configured above, so it normally needs no value here.
# hytale.assets=P:/path/to/Assets.zip

# Extra Hytale server flags, appended to the command line (space separated).
# hytale.serverArgs=--bare

# --- manifest.json contents (generatePluginManifest) ----------------------------------
# run/mods/<group>.<name>/manifest.json is rewritten from these on every run, so configure
# the manifest here rather than editing the generated JSON.
#
#   authors               Name|Email|Url entries, comma separated (Email and Url optional)
#   dependencies          Group:Name=versionRange entries, comma separated
#   optionalDependencies  same syntax as dependencies
#   loadBefore            same syntax as dependencies
#   subPlugins            Name=MainClass entries, comma separated
#
# An empty mainClass omits "Main", which makes the folder an asset pack rather than a code plugin.
hytale.plugin.description=
hytale.plugin.authors=
hytale.plugin.website=
hytale.plugin.mainClass=org.example.TestPlugin
hytale.plugin.serverVersion=*
hytale.plugin.dependencies=
hytale.plugin.optionalDependencies=
hytale.plugin.loadBefore=
hytale.plugin.subPlugins=
hytale.plugin.disabledByDefault=false
hytale.plugin.includesAssetPack=true

# --- Implementation references --------------------------------------------------------
# Pointers for whoever implements the plugin, human or agent. The build produces nothing from
# them; `gradlew referencePaths` prints them and warns when a path is missing.
#
#   hytale.reference.assets  real asset JSON plus the JSON schema for every asset type: use the
#                            schemas to learn an asset's fields and the existing JSON as examples
#   hytale.reference.source  a complete working plugin (commands, events, components, UI, and its
#                            own Common/ and Server/ assets) - the closest analogue to this project
#
# NOTE: backslashes are escape characters in .properties files, so use forward slashes.
hytale.reference.assets=P:/Users/abrah/Desktop/Programing projects/hytale/hytale-shared-source/HytaleAssets
hytale.reference.source=P:/Users/abrah/Desktop/Programing projects/hytale/ExampleJavaPlugin/Hytale-Example-Plugin